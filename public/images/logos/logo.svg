<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo oscuro elegante -->
  <rect width="100%" height="100%" fill="#0f111a"/>

  <!-- Símbolo: Pirámide abstracta estilo blockchain -->
  <g transform="translate(35, 30)">
    <defs>
      <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFD700"/>
        <stop offset="100%" stop-color="#FFA500"/>
      </linearGradient>
    </defs>

    <!-- Base -->
    <polygon points="0,40 30,30 60,40 30,70" fill="url(#goldGradient)" opacity="0.8"/>

    <!-- Línea superior central -->
    <polygon points="20,10 40,10 30,30" fill="url(#goldGradient)"/>

    <!-- Línea superior central -->
    <polygon points="50,110 170,12 120,90" fill="url(#goldGradient)"/>

    <!-- Brillo sutil -->
    <path d="M20 10 L30 30 L40 10 Z" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  </g>

